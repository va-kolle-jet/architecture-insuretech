type Query {
    client(clientId: String!): Client
    clientDocuments(clientId: String!): [Document!]!
    clientRelatives(clientId: String!): [Relative!]!
}

type Client {
    id: String!
    name: String
    age: Int
    documents: [Document!]!
    relatives: [Relative!]!
}

type Document {
    id: String!
    type: String
    number: String
    issueDate: String
    expiryDate: String
}

type Relative {
    id: String!
    relationType: String
    name: String
    age: Int
}